[package]
name = "fenced"
description = "The pg_fence sync daemon: relays relationship writes to SpiceDB and keeps the projection in Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fence-schema = { path = "../fence-schema" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-postgres = "0.7"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"


[lints]
workspace = true
