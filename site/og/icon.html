<!doctype html>
<!-- The raster icons, for browsers without SVG favicons: public/favicon.ico (#ico, 32px, opaque, since the
     screenshot CLI cannot keep transparency) and public/apple-touch-icon.png (#touch, 180px). og/render.sh shoots both. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; }
  body.touch { background: #f4f6f8; display: grid; place-items: center; }
  body.touch svg { width: 72%; height: 72%; }
  body.ico { background: #ffffff; }
  svg { display: block; width: 100%; height: 100%; }
</style></head>
<body><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="3" width="26" height="26" rx="4" fill="#ffffff" stroke="#182030" stroke-width="2.5"/><path d="M10 10v12M16 10v12M22 10v12" stroke="#182030" stroke-width="2.5" stroke-linecap="round"/><path d="M7 16h18" stroke="#4a3fd0" stroke-width="2.5" stroke-linecap="round"/></svg>
<script>document.body.className = location.hash.slice(1);</script></body></html>
